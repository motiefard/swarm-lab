version: "3.8"

services:

  web:
    image: nginx:alpine

    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress

    deploy:
      replicas: 3

      restart_policy:
        condition: on-failure

      update_config:
        parallelism: 1
        delay: 10s

      resources:
        limits:
          cpus: "0.50"
          memory: 128M

    networks:
      - web-network

networks:
  web-network:
    driver: overlay
