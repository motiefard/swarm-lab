version: "3.8"

services:

  # -------------------------
  # NGINX FRONTEND
  # -------------------------

  nginx:
    image: nginx:alpine

    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress

    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf

    networks:
      - frontend-network

    deploy:
      replicas: 2

      restart_policy:
        condition: on-failure

      resources:
        limits:
          cpus: "0.25"
          memory: 64M


  # -------------------------
  # FLASK BACKEND
  # -------------------------

  backend:
    image: swarm-lab-backend:1.0

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    networks:
      - frontend-network
      - backend-network

    deploy:
      replicas: 2

      restart_policy:
        condition: on-failure

      resources:
        limits:
          cpus: "0.50"
          memory: 256M


  # -------------------------
  # REDIS CACHE
  # -------------------------

  redis:
    image: redis:7-alpine

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    networks:
      - backend-network

    deploy:
      replicas: 1

      restart_policy:
        condition: on-failure

      resources:
        limits:
          cpus: "0.25"
          memory: 128M


# -------------------------
# NETWORKS
# -------------------------

networks:

  frontend-network:
    driver: overlay

  backend-network:
    driver: overlay


# -------------------------
# PERSISTENT STORAGE
# -------------------------

volumes:

  redis-data:


# -------------------------
# NGINX CONFIGURATION
# -------------------------

configs:

  nginx_config:
    file: ./nginx/default.conf
